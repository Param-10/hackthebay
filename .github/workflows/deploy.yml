name: Deploy on PR

on:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log PR info
        run: |
          echo "Deploying PR: ${{ github.event.pull_request.title }}"
          echo "Author branch: ${{ github.event.pull_request.head.ref }}"

      - name: Build Docker image
        run: |
          set -euo pipefail

          DOCKERFILE_PATH="$(find . -maxdepth 4 -type f -name Dockerfile | head -n 1)"
          if [ -z "${DOCKERFILE_PATH}" ]; then
            echo "No Dockerfile found in repository. Skipping Docker build."
            exit 0
          fi

          BUILD_CONTEXT="$(dirname "${DOCKERFILE_PATH}")"
          echo "Using Dockerfile: ${DOCKERFILE_PATH}"
          echo "Using build context: ${BUILD_CONTEXT}"

          docker build \
            -f "${DOCKERFILE_PATH}" \
            -t "myapp:${{ github.sha }}" \
            "${BUILD_CONTEXT}"

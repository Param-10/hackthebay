apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
spec:
      hostNetwork: false
      containers:
      - name: api
        image: myapp:latest
securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        ports:
        - containerPort: 22
